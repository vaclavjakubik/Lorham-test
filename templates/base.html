<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorham</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="container">
    <ul>
      <li><a href="{{ url_for('index') }}"><strong>Lorham</strong></a></li>
      <li><a href="{{ url_for('lead_new') }}">Nová poptávka</a></li>
    </ul>
    <ul>
      <li>
        <form method="post" action="{{ url_for('switch_user') }}">
          <fieldset role="group">
            <select name="user_id" aria-label="Pracuji jako">
              <option value="">— pracuji jako —</option>
              {% for user in users %}
                <option value="{{ user.id }}" {% if current_user and current_user.id == user.id %}selected{% endif %}>
                  {{ user.name }} ({{ roles[user.role] }})
                </option>
              {% endfor %}
            </select>
            <button type="submit">Přepnout</button>
          </fieldset>
        </form>
      </li>
    </ul>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <article class="{{ category }}">{{ message }}</article>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
